<div class="module-box" style="height: 100%; overflow-y: auto;">
    <div class="gauge-column" style="display: flex; flex-direction: column; align-items: center; padding: 6px 0;">
        <!-- 1. Literacy -->
        <div class="gauge-wrapper" title="Literacy (Reading & Writing)" style="text-align: center; margin-bottom: 12px;">
            <div class="book-badge" id="gauge-literacy" style="--fill-pct: 0; border: 2px solid #1A1A1A; background: #E3F2FD; border-radius: 12px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; margin: 0 auto; position: relative;">
                <svg class="book-svg" viewBox="0 0 52 52" style="width: 24px; height: 24px; position: absolute;">
                    <path class="book-base" d="M6 14 C 6 10, 14 8, 26 12 C 38 8, 46 10, 46 14 L 46 42 C 46 42, 38 40, 26 44 C 14 40, 6 42, 6 42 Z" fill="#E3F2FD" />
                    <g style="clip-path: url(#book-clip)">
                        <path class="book-fill" d="M6 14 C 6 10, 14 8, 26 12 C 38 8, 46 10, 46 14 L 46 42 C 46 42, 38 40, 26 44 C 14 40, 6 42, 6 42 Z" fill="#2196F3" />
                    </g>
                    <defs>
                        <clipPath id="book-clip">
                            <rect x="0" y="0" width="52" height="52" id="book-clip-rect" />
                        </clipPath>
                    </defs>
                </svg>
                <span id="literacy-value" style="font-size: 9px; font-weight: bold; color: #2D1B4E; z-index: 2;">-</span>
            </div>
            <div class="gauge-label" style="font-size: 7px; font-weight: bold; margin-top: 6px;">Literacy</div>
            <div class="badge-slot" id="badge-literacy"></div>
        </div>
        
        <!-- 2. Fine Motor -->
        <div class="gauge-wrapper" title="Fine Motor (Tracing & Manipulation)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-fine_motor" style="width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(#2196F3 0deg, #E3F2FD 0deg); border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                <span id="fine_motor-value" style="font-size: 9px; font-weight: bold; color: #2D1B4E;">-</span>
            </div>
            <div class="gauge-label" style="font-size: 7px; font-weight: bold; margin-top: 6px;">Fine Motor</div>
            <div class="badge-slot" id="badge-fine_motor"></div>
        </div>
        
        <!-- 3. Numeracy -->
        <div class="gauge-wrapper" title="Numeracy (Numbers & Logic)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-numeracy" style="width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(#2196F3 0deg, #E3F2FD 0deg); border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                <span id="numeracy-value" style="font-size: 9px; font-weight: bold; color: #2D1B4E;">-</span>
            </div>
            <div class="gauge-label" style="font-size: 7px; font-weight: bold; margin-top: 6px;">Numeracy</div>
            <div class="badge-slot" id="badge-numeracy"></div>
        </div>
        
        <!-- 4. Oral Language -->
        <div class="gauge-wrapper" title="Oral Language (Communication)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-oral_lang" style="width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(#2196F3 0deg, #E3F2FD 0deg); border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                <span id="oral_lang-value" style="font-size: 9px; font-weight: bold; color: #2D1B4E;">-</span>
            </div>
            <div class="gauge-label" style="font-size: 7px; font-weight: bold; margin-top: 6px;">Oral Lang.</div>
            <div class="badge-slot" id="badge-oral_lang"></div>
        </div>
        
        <!-- 5. Gross Motor -->
        <div class="gauge-wrapper" title="Gross Motor (Movement & Coordination)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-gross_motor" style="width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(#2196F3 0deg, #E3F2FD 0deg); border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                <span id="gross_motor-value" style="font-size: 9px; font-weight: bold; color: #2D1B4E;">-</span>
            </div>
            <div class="gauge-label" style="font-size: 7px; font-weight: bold; margin-top: 6px;">Gross Motor</div>
            <div class="badge-slot" id="badge-gross_motor"></div>
        </div>
        
        <!-- 6. Receptive Language -->
        <div class="gauge-wrapper" title="Receptive Language (Listening & Understanding)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-receptive_lang" style="width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(#2196F3 0deg, #E3F2FD 0deg); border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                <span id="receptive_lang-value" style="font-size: 9px; font-weight: bold; color: #2D1B4E;">-</span>
            </div>
            <div class="gauge-label" style="font-size: 7px; font-weight: bold; margin-top: 6px;">Receptive Lang.</div>
            <div class="badge-slot" id="badge-receptive_lang"></div>
        </div>
        
        <!-- 7. Personal & Social -->
        <div class="gauge-wrapper" title="Personal & Social (Manners & Character)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-personal" style="width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(#2196F3 0deg, #E3F2FD 0deg); border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                <span id="personal-value" style="font-size: 9px; font-weight: bold; color: #2D1B4E;">-</span>
            </div>
            <div class="gauge-label" style="font-size: 7px; font-weight: bold; margin-top: 6px;">P & S</div>
            <div class="badge-slot" id="badge-personal"></div>
        </div>
        
        <!-- 8. Creative Arts -->
        <div class="gauge-wrapper" title="Creative Arts (Expression)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-creative_arts" style="width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(#2196F3 0deg, #E3F2FD 0deg); border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                <span id="creative_arts-value" style="font-size: 9px; font-weight: bold; color: #2D1B4E;">-</span>
            </div>
            <div class="gauge-label" style="font-size: 7px; font-weight: bold; margin-top: 6px;">Creative Arts</div>
            <div class="badge-slot" id="badge-creative_arts"></div>
        </div>
        
        <!-- 9. World Inquiry -->
        <div class="gauge-wrapper" title="World Inquiry (Exploration)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-my_world" style="width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(#2196F3 0deg, #E3F2FD 0deg); border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                <span id="my_world-value" style="font-size: 9px; font-weight: bold; color: #2D1B4E;">-</span>
            </div>
            <div class="gauge-label" style="font-size: 7px; font-weight: bold; margin-top: 6px;">World Inquiry</div>
            <div class="badge-slot" id="badge-my_world"></div>
        </div>

        <!-- 10. My Hours -->
        <div class="gauge-wrapper" title="My Hours" style="text-align: center; margin-bottom: 6px;">
            <div class="gauge-circle green" id="gauge-my_hours" style="width: 28px; height: 28px; border-radius: 50%; background: conic-gradient(#00C853 360deg, #E8F5E9 0deg); border: 2px solid #1A1A1A; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
                <span id="my_hours-value" style="font-size: 9px; font-weight: bold; color: #2D1B4E;">-</span>
            </div>
            <div class="gauge-label" style="font-size: 7px; font-weight: bold; margin-top: 6px;">My Hours</div>
            <div class="badge-slot" id="badge-my_hours"></div>
        </div>
    </div>
</div>
