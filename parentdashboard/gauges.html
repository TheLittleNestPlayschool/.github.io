<div class="module-box">
    <div class="gauge-column">
        <!-- 1. Literacy -->
        <div class="gauge-wrapper" title="Literacy (Reading & Writing)">
            <div class="gauge-circle" id="gauge-literacy" style="--progress: 0%;"></div>
            <div class="gauge-label">Literacy</div>
            <div class="badge-slot" id="badge-literacy"></div>
        </div>
        
        <!-- 2. Fine Motor -->
        <div class="gauge-wrapper" title="Fine Motor (Tracing & Manipulation)">
            <div class="gauge-circle" id="gauge-fine_motor" style="--progress: 0%;"></div>
            <div class="gauge-label">Fine Motor</div>
            <div class="badge-slot" id="badge-fine_motor"></div>
        </div>
        
        <!-- 3. Numeracy -->
        <div class="gauge-wrapper" title="Numeracy (Numbers & Logic)">
            <div class="gauge-circle" id="gauge-numeracy" style="--progress: 0%;"></div>
            <div class="gauge-label">Numeracy</div>
            <div class="badge-slot" id="badge-numeracy"></div>
        </div>
        
        <!-- 4. Oral Language -->
        <div class="gauge-wrapper" title="Oral Language (Communication)">
            <div class="gauge-circle" id="gauge-oral_lang" style="--progress: 0%;"></div>
            <div class="gauge-label">Oral Lang.</div>
            <div class="badge-slot" id="badge-oral_lang"></div>
        </div>
        
        <!-- 5. Gross Motor -->
        <div class="gauge-wrapper" title="Gross Motor (Movement & Coordination)">
            <div class="gauge-circle" id="gauge-gross_motor" style="--progress: 0%;"></div>
            <div class="gauge-label">Gross Motor</div>
            <div class="badge-slot" id="badge-gross_motor"></div>
        </div>
        
        <!-- 6. Receptive Language -->
        <div class="gauge-wrapper" title="Receptive Language (Listening & Understanding)">
            <div class="gauge-circle" id="gauge-receptive_lang" style="--progress: 0%;"></div>
            <div class="gauge-label">Receptive Lang.</div>
            <div class="badge-slot" id="badge-receptive_lang"></div>
        </div>
        
        <!-- 7. Personal & Social -->
        <div class="gauge-wrapper" title="Personal & Social (Manners & Character)">
            <div class="gauge-circle" id="gauge-personal" style="--progress: 0%;"></div>
            <div class="gauge-label">P & S</div>
            <div class="badge-slot" id="badge-personal"></div>
        </div>
        
        <!-- 8. Creative Arts -->
        <div class="gauge-wrapper" title="Creative Arts (Expression)">
            <div class="gauge-circle" id="gauge-creative_arts" style="--progress: 0%;"></div>
            <div class="gauge-label">Creative Arts</div>
            <div class="badge-slot" id="badge-creative_arts"></div>
        </div>
        
        <!-- 9. World Inquiry -->
        <div class="gauge-wrapper" title="World Inquiry (Exploration)">
            <div class="gauge-circle" id="gauge-my_world" style="--progress: 0%;"></div>
            <div class="gauge-label">World Inquiry</div>
            <div class="badge-slot" id="badge-my_world"></div>
        </div>

        <!-- 10. My Hours -->
        <div class="gauge-wrapper" title="My Hours">
            <div class="gauge-circle green" id="gauge-my_hours" style="--progress: 100%;">
                <span id="hours-value" style="position: relative; z-index: 1; font-size: 10px; font-weight: bold; color: #2D1B4E;">0</span>
            </div>
            <div class="gauge-label">My Hours</div>
            <div class="badge-slot" id="badge-my_hours"></div>
        </div>
    </div>
</div>
