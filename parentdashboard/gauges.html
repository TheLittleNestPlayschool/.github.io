<div class="module-box" style="height: 100%; overflow-y: auto;">
    <div class="gauge-column" style="display: flex; flex-direction: column; align-items: center; padding: 6px 0;">
        <!-- 1. Literacy -->
        <div class="gauge-wrapper" title="Literacy (Reading & Writing)" style="text-align: center; margin-bottom: 12px;">
            <div class="book-badge" id="gauge-literacy" style="position: relative; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center;">
                <!-- SVG Book Outline & Light Blue Background -->
                <svg class="book-svg" viewBox="0 0 52 52" style="position: absolute; width: 100%; height: 100%; z-index: 2; pointer-events: none;">
                    <path d="M6 14 C 6 10, 14 8, 26 12 C 38 8, 46 10, 46 14 L 46 42 C 46 42, 38 40, 26 44 C 14 40, 6 42, 6 42 Z" fill="transparent" stroke="#1A1A1A" stroke-width="2" />
                </svg>
                
                <!-- Light Blue Background Fill (Base) -->
                <div style="position: absolute; inset: 4px; background: #BBDEFB; border-radius: 4px; z-index: 1; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;">
                    <!-- Dark Blue Fill Growing from Bottom Up -->
                    <div id="literacy-fill-bar" style="width: 100%; height: 0%; background: #1565C0; transition: height 0.3s ease;"></div>
                </div>

                <!-- Text Value on Top -->
                <span id="literacy-value" style="position: relative; z-index: 3; font-weight: bold; font-size: 14px; color: #1A1A1A;">-</span>
            </div>
            <div class="gauge-label">Lit</div>
            <div class="badge-slot" id="badge-literacy"></div>
        </div>
        
        <!-- 2. Fine Motor -->
        <div class="gauge-wrapper" title="Fine Motor (Tracing & Manipulation)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-fine_motor">
                <span id="fine_motor-value">-</span>
            </div>
            <div class="gauge-label">Fine Motor</div>
            <div class="badge-slot" id="badge-fine_motor"></div>
        </div>
        
        <!-- 3. Numeracy -->
        <div class="gauge-wrapper" title="Numeracy (Numbers & Logic)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-numeracy">
                <span id="numeracy-value">-</span>
            </div>
            <div class="gauge-label">Numeracy</div>
            <div class="badge-slot" id="badge-numeracy"></div>
        </div>
        
        <!-- 4. Oral Language -->
        <div class="gauge-wrapper" title="Oral Language (Communication)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-oral_lang">
                <span id="oral_lang-value">-</span>
            </div>
            <div class="gauge-label">Oral Lang.</div>
            <div class="badge-slot" id="badge-oral_lang"></div>
        </div>
        
        <!-- 5. Gross Motor -->
        <div class="gauge-wrapper" title="Gross Motor (Movement & Coordination)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-gross_motor">
                <span id="gross_motor-value">-</span>
            </div>
            <div class="gauge-label">Gross Motor</div>
            <div class="badge-slot" id="badge-gross_motor"></div>
        </div>
        
        <!-- 6. Receptive Language -->
        <div class="gauge-wrapper" title="Receptive Language (Listening & Understanding)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-receptive_lang">
                <span id="receptive_lang-value">-</span>
            </div>
            <div class="gauge-label">Receptive Lang.</div>
            <div class="badge-slot" id="badge-receptive_lang"></div>
        </div>
        
        <!-- 7. Personal & Social -->
        <div class="gauge-wrapper" title="Personal & Social (Manners & Character)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-personal">
                <span id="personal-value">-</span>
            </div>
            <div class="gauge-label">P & S</div>
            <div class="badge-slot" id="badge-personal"></div>
        </div>
        
        <!-- 8. Creative Arts -->
        <div class="gauge-wrapper" title="Creative Arts (Expression)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-creative_arts">
                <span id="creative_arts-value">-</span>
            </div>
            <div class="gauge-label">Creative Arts</div>
            <div class="badge-slot" id="badge-creative_arts"></div>
        </div>
        
        <!-- 9. World Inquiry -->
        <div class="gauge-wrapper" title="World Inquiry (Exploration)" style="text-align: center; margin-bottom: 12px;">
            <div class="gauge-circle" id="gauge-my_world">
                <span id="my_world-value">-</span>
            </div>
            <div class="gauge-label">World Inquiry</div>
            <div class="badge-slot" id="badge-my_world"></div>
        </div>

        <!-- 10. My Hours -->
        <div class="gauge-wrapper" title="My Hours" style="text-align: center; margin-bottom: 6px;">
            <div class="gauge-circle green" id="gauge-my_hours">
                <span id="my_hours-value">-</span>
            </div>
            <div class="gauge-label">My Hours</div>
            <div class="badge-slot" id="badge-my_hours"></div>
        </div>
    </div>
</div>
